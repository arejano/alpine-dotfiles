theme = "amberwood"

[editor]
line-number = "relative"
true-color = true
auto-completion = true
undercurl = true
cursorline = true
color-modes = true
idle-timeout = 40
auto-save = true
rulers = [40, 80]

[editor.file-picker]
hidden = false

[editor.cursor-shape]
insert = 'bar'
normal = 'block'
select = 'underline'

[editor.soft-wrap]
enable = true

[editor.lsp]
enable = true
display-messages = true
display-inlay-hints = true

[editor.whitespace.render]
tab = "all"
# space = "all"
newline = "none"

[editor.whitespace.characters]
space = "."
nbsp = "⍽"
tab = "-"
newline = "⏎"
#tabpad = "."

[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "╎", "┆", "┊"
skip-levels = 0

[editor.statusline]
left = [
  "mode",
  "spacer",
  "spinner",
  "spacer",
  "version-control",
  "spacer",
  "read-only-indicator",
  # "file-type-icon",
  "file-name",
  "file-modification-indicator",
  "register",
]
center = ["diagnostics", "workspace-diagnostics"]
right = [
  "selections",
  "primary-selection-length",
  "position",
  "position-percentage",
  "file-encoding",
  "file-line-ending",
  "file-type",
]
separator = "│"

[keys.normal]
"C-s" = ":write"
# "X" = "extend_line_above"
X = ["extend_line_up", "extend_to_line_bounds"]
esc = ["collapse_selection", "keep_primary_selection"]
# "z" = { "o" = [":toggle soft-wrap.wrap-at-text-width"] }


[keys.normal."+"]
m = ":run-shell-command echo 2"
c = ":run-shell-command cargo run"
x = ":config-reload"

[keys.normal.space]
"." = "file_picker_in_current_buffer_directory"

